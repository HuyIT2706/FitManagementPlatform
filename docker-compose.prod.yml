version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fit_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-fit_management_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-fit_management_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      file: apps/backend/Dockerfile
    container_name: fit_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-3100}:3001"
    env_file:
      - apps/backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      file: apps/web/Dockerfile
    container_name: fit_web_prod
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - apps/web/.env
    depends_on:
      - backend

volumes:
  pgdata_prod:

