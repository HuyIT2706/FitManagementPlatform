version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fit_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be specified for production}
      POSTGRES_DB: ${POSTGRES_DB:-fit_management_db}
    expose:
      - "5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - nutricore_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fit_management_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Automated daily PostgreSQL backup with retention policy (7 daily, 4 weekly, 6 monthly)
  db-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: fit_db_backup_prod
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-fit_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be specified for production}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
    networks:
      - nutricore_net
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      file: apps/backend/Dockerfile
    container_name: fit_backend_prod
    restart: always
    environment:
      PORT: ${BACKEND_INTERNAL_PORT:-3100}
      NODE_ENV: production
    expose:
      - "3100"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3100}:3100"
    env_file:
      - apps/backend/.env
    networks:
      - nutricore_net
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      file: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.${DOMAIN:-nutricore.example.com}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_API_ENCRYPTION_KEY: ${NEXT_PUBLIC_API_ENCRYPTION_KEY:-}
    container_name: fit_web_prod
    restart: always
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    env_file:
      - apps/web/.env
    networks:
      - nutricore_net
    depends_on:
      - backend

  # HTTPS Reverse Proxy with TLS 1.2/1.3 & Rate Limiting
  nginx:
    image: nginx:1.27-alpine
    container_name: fit_nginx_prod
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-nutricore.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - nutricore_net
    depends_on:
      - web
      - backend
    # Automatically reload Nginx every 6 hours to pick up renewed SSL certificates
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Automated Let's Encrypt SSL Renewal Service
  certbot:
    image: certbot/certbot:latest
    container_name: fit_certbot_prod
    restart: always
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

networks:
  nutricore_net:
    driver: bridge

volumes:
  pgdata_prod:
